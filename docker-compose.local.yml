name: tk-crm-local

services:
  backend:
    image: tk-crm-local-backend:latest
    build: ./backend
    env_file:
      - ./docker-local/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      UPDATE_AGENT_URL: ""
      UPDATE_AGENT_TOKEN: ""
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - ./docker-local/data:/app/data
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:8080:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  frontend_node_modules:
